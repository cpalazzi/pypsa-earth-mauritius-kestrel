# Energy interruption-model settings (mu_star_energy). PyPSA-Earth is configured
# separately under pypsa-earth/.
data_root: data

energy:
  base_network:
    # Bridge only short breaks in the provided transmission route geometry.
    route_gap_tolerance_m: 75
    # Source routes are the CEB 66 kV network. The high topology rating avoids
    # inventing congestion before reviewed line ratings are available.
    default_voltage_kv: 66
    topology_capacity_mva: 10000

  inferred_network:
    region: mauritius-rodrigues
    # VIIRS nightlight targets filter the drivable OSM road network; the
    # resulting inferred product keeps road cycles and the reviewed-data variant
    # also preserves the main CEB backbone. "drive" excludes footpaths, tracks
    # and hiking trails (use "all" only to inspect every mapped way).
    network_type: drive
    nightlight_threshold: 0.1
    nightlight_support_distance_m: 1000
    line_length_tolerance_fraction: 0.10

  distribution_proxy:
    # Optional inputs for the lower-level prepare-inferred-distribution command.
    # The named inferred builds above run the nightlight-driven road-filter
    # method directly and do not read these legacy experiment paths.
    precomputed_lines: 0-incoming/energy/inferred/distribution_lines.gpkg
    osm_distribution_lines: 0-incoming/energy/osm/distribution_lines.parquet

  operations:
    solver: highs
    value_of_lost_load_eur_per_mwh: 10000
    capacity_expansion: false

  validation:
    # CEB reports 442 km overhead plus 36.9 km underground at 66 kV.
    # This is an advisory coverage check because route and circuit length may differ.
    ceb_transmission_length_km: 478.9
    # CEB's reported total across transmission, MV and LV (31 December 2024).
    ceb_total_network_length_km: 10492.2
    line_length_tolerance_fraction: 0.35
    # CEB Annual Report 2023-2024 pp. 50-51, installed-capacity grand total.
    ceb_reported_installed_generation_mw: 881.56
    generation_capacity_tolerance_fraction: 0.10
