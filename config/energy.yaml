data_root: data

energy:
  topology:
    default_voltage_kv: 66
    snap_tolerance_m: 2500

  distribution_proxy:
    # Paths are relative to data_root. GridFinder is an inferred spatial proxy,
    # not a validated electrical network.
    gridfinder_lines: 0-incoming/energy/gridfinder/grid.gpkg
    osm_distribution_lines: 0-incoming/energy/osm/distribution_lines.parquet

  operations:
    solver: highs
    value_of_lost_load_eur_per_mwh: 10000
    capacity_expansion: false
