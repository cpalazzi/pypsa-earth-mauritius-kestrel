# Mauritius first-week smoke test. Keeps run.name aligned with the annual
# profile directory so renewable profiles are reused.

version: 0.8.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

results_dir: results/
summary_dir: results/

foresight: overnight

countries:
  - MU

enable:
  retrieve_databundle: false
  retrieve_databundle_sector: false
  retrieve_cost_data: false
  download_osm_data: true
  download_global_buildings: false
  build_natura_raster: false
  build_cutout: false
  progress_bar: true
  custom_busmap: false

custom_rules: []

run:
  name: "mauritius-year-1"
  sector_name: ""
  shared_cutouts: true
  allow_scenario_failure: false

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: ["12flex"]
  opts: [3h-week01]
  planning_horizons:
  - 2030
  sopts:
  - "168h"
  demand:
  - "AB"

snapshots:
  start: "2013-01-01"
  end: "2013-01-08"
  inclusive: "left"

electricity:
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
    StorageUnit: []
    Store: [battery]
    Link: []

atlite:
  nprocesses: 4
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.1
      dy: 0.1

